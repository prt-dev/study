<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>

    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 50vh;
            width: 900px;
            margin: 0 auto;
            background-color: lightblue;
            flex-wrap: wrap;
        }

        .box {
            height: 100px;
            width: 300px;
            background-color: lightcoral;
            margin: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            flex-basis: 200px;
            flex-grow: 1;
        }

        .box1 {
            /* flex-grow: 2; */
        }

        .box2 {
            /* flex-shrink: 1; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
    </div>
</body>

</html>
